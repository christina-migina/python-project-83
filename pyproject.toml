[project]
name = "hexlet-code"
version = "0.1.0"
description = "Page Analyzer — сайт, который анализирует указанные страницы на SEO-пригодность по аналогии с PageSpeed Insights. Пользователь добавляет адреса сайтов, запускает проверку и видит её результаты, сохранённые в базе данных."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.3",
    "gunicorn>=26.2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["page_analyzer"]

[dependency-groups]
dev = [
    "ruff>=0.17.3",
]
